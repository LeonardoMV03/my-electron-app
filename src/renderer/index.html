<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>¡Hola desde el renderizador Electron!</title>
  </head>
  <body>
    <section id="view-main">
      <h1>¡Hola desde el renderizador Electron!</h1>
      <p>👋</p>
      <p id="info"></p>

      <section>
        <h2>Contador (IPC)</h2>
        <p>Valor: <span id="count-value">0</span></p>
        <button id="count-button">Incrementar</button>
      </section>

      <section>
        <h2>Selector de archivos (dialog nativo)</h2>
        <button id="file-button">Elegir archivo</button>
        <p id="file-path"></p>
      </section>

      <section>
        <h2>Notificación nativa</h2>
        <button id="notify-button">Mostrar notificación</button>
      </section>

      <button id="go-notes">Ir a la vista de notas</button>
    </section>

    <section id="view-notes" hidden>
      <h2>Notas (SQLite)</h2>
      <form id="note-form">
        <input id="note-title" type="text" maxlength="100" placeholder="Título (obligatorio)" required />
        <input id="note-input" type="text" maxlength="500" placeholder="Contenido (opcional)" />
        <button type="submit">Agregar</button>
      </form>
      <ul id="note-list"></ul>
      <button id="go-home">Volver al inicio</button>
    </section>
  </body>
  <script src="./renderer.js"></script>
</html>
